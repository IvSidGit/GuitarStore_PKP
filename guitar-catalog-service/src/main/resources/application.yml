server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: guitar-catalog-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/course}
          audiences: library-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/guitar-catalog}
    username: ${DB_USER:course}
    password: ${DB_PASSWORD:course-dev-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

